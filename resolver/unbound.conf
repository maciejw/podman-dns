server:
    interface: 0.0.0.0@1053
    https-port: 1053
    http-endpoint: "/dns-query"
    tls-service-key: "/doh/cert.key"
    tls-service-pem: "/doh/cert.pem"
    access-control: 0.0.0.0/0 allow
    local-zone: "." refuse
    local-zone: "dns.podman." transparent
    local-zone: "dev.internal." transparent
    username: ""
    chroot: ""
    pidfile: ""
    use-syslog: no
    log-queries: yes
    cache-max-ttl: 5

    module-config: "respip iterator"
    response-ip: 0.0.0.0/0 redirect
    response-ip-data: 0.0.0.0/0 "5 IN A 127.0.0.1"
    response-ip: ::/0 redirect

# Resolve the DNAME locally, then look up the translated name in Podman.
auth-zone:
    name: "dev.internal."
    zonefile: "/etc/unbound/dev.internal.zone"
    for-downstream: no
    for-upstream: yes

forward-zone:
    name: "dns.podman."
    include: "/tmp/podman-upstreams.conf"
